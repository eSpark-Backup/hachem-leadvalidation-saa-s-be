# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "stg" ]
  pull_request:
    branches: [ "stg" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Check Directory
        run: ls -la

      # Runs a set of commands using the runners shell
      - name: Get Latest Pull 
        run: |
          echo "Short SHA: ${GITHUB_SHA::5}"
      
      - name: Docker Build
        run: docker build -t hachem-leadvalidationsaas-be:stg-${GITHUB_SHA::5} -f Dockerfile .
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: AKIAXW5OGZH2ACFVO75S
          aws-secret-access-key: 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
          aws-region: us-east-1 

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag variables
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=${GITHUB_SHA::5}
          IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: hachem-leadvalidationsaas-be
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
  #   # ... [your existing CI job remains unchanged above] ...

  deploy:
    needs: build  # run after the build job
    runs-on: ubuntu-latest

    steps:
      - name: Set image tag again (cannot use saved envs from build job)
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=${GITHUB_SHA::5}
          IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> tag.txt
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: AKIAXW5OGZH2ACFVO75S
          aws-secret-access-key: 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
          aws-region: us-east-1 
      - name: Download Key
        run: |
            aws s3 cp s3://devops-key-github/key.pem .
            chmod 600 key.pem
            cat tag.txt
    
      - name: Deploy via SSH
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          scp -o StrictHostKeyChecking=no -i key.pem tag.txt github-actions@54.234.173.111:/home/github-actions/ 
          ssh -o StrictHostKeyChecking=no -i key.pem github-actions@54.234.173.111 << 'EOF'
          cat tag.txt 
          IMAGE_TAG=$(sudo cat tag.txt)
          cd /var/www/vhosts/hachem
          sudo $IMAGE_TAG docker compose up -d

          EOF


